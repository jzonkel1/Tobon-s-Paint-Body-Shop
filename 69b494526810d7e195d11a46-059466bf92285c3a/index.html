<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/body_shop_car_repair.png" />
    <link rel="apple-touch-icon" href="/body_shop_car_repair.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dc2626" />
    <title>Tobon's Paint & Body Shop | Auto Body Repair Corpus Christi TX Since 1989</title>
    <meta name="description" content="Expert auto body repair, collision repair, auto painting, dent removal, and vehicle detailing in Corpus Christi, TX. Serving the community since 1989. Call 361-887-6606 for free estimates." />
    <meta name="author" content="Tobon's Paint & Body Shop" />
    <link rel="canonical" href="https://tobonsautopaintandbody.com/" />

    <!-- Start fetching the above-the-fold art while the JS bundle is still downloading.
         The heroes are CSS backgrounds set from React, so without these the browser
         can't discover them until after the bundle parses and renders. -->
    <link rel="preload" as="image" href="/body_shop_car_repair.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-home.jpg" fetchpriority="high" />

    <meta property="og:title" content="Tobon's Paint & Body Shop | Auto Body Repair Corpus Christi TX" />
    <meta property="og:description" content="Professional auto body repair services in Corpus Christi since 1989. Collision repair, painting, dent removal, and detailing. Call 361-887-6606." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tobonsautopaintandbody.com/" />
    <meta property="og:site_name" content="Tobon's Paint & Body Shop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://tobonsautopaintandbody.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tobon's Paint & Body Shop — auto body and collision repair in Corpus Christi, Texas. 361-887-6606" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tobon's Paint & Body Shop | Auto Body Repair Corpus Christi" />
    <meta name="twitter:description" content="Expert auto body repair services since 1989. Call 361-887-6606 for free estimates." />
    <meta name="twitter:image" content="https://tobonsautopaintandbody.com/og-image.jpg" />

    <meta name="geo.region" content="US-TX" />
    <meta name="geo.placename" content="Corpus Christi" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@1,900&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoBodyShop",
      "@id": "https://tobonsautopaintandbody.com/#business",
      "name": "Tobon's Paint & Body Shop",
      "description": "Family owned auto body shop in Corpus Christi, Texas offering collision repair, auto painting, dent removal, vehicle detailing, and headlight restoration since 1989.",
      "url": "https://tobonsautopaintandbody.com/",
      "telephone": "+1-361-887-6606",
      "image": "https://tobonsautopaintandbody.com/og-image.jpg",
      "logo": "https://tobonsautopaintandbody.com/body_shop_car_repair.png",
      "foundingDate": "1989",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1104 S Port Ave",
        "addressLocality": "Corpus Christi",
        "addressRegion": "TX",
        "postalCode": "78405",
        "addressCountry": "US"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "18:00"
        }
      ],
      "areaServed": [
        { "@type": "City", "name": "Corpus Christi" },
        { "@type": "City", "name": "Portland" },
        { "@type": "City", "name": "Ingleside" },
        { "@type": "City", "name": "Robstown" },
        { "@type": "City", "name": "Aransas Pass" }
      ],
      "sameAs": [
        "https://www.facebook.com/TobonsPaintAndBodyShop",
        "https://www.yelp.com/biz/tobons-paint-and-body-shop-corpus-christi",
        "https://autorepairscore.com/tx/corpus-christi/tobons-paint-body-shop-corpus-christi-texas"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Auto Body Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Collision Repair" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Auto Painting" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dent Removal" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Vehicle Detailing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Headlight Restoration" } }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden form for Netlify build-bot discovery (React SPA requires this) -->
    <form name="estimate-request" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="file" name="photos" />
    </form>
  </body>
</html>
